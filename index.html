<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08110e">
  <meta name="description" content="Muhaffiz is coming soon. A new experience is on its way.">
  <title>Muhaffiz — Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08110e;
      --green: #b7f28b;
      --muted: #a0ada5;
      --line: rgba(215, 244, 221, .13);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: #f5f8f4;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      opacity: .16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
    }

    .scene {
      position: relative;
      display: grid;
      min-height: 100svh;
      place-items: center;
      isolation: isolate;
      padding: 32px 24px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(35, 91, 61, .24), transparent 43%),
        radial-gradient(ellipse at 50% 100%, rgba(26, 60, 42, .16), transparent 46%);
    }

    #stars { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      padding: 30px clamp(24px, 6vw, 88px);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .19em;
      text-transform: uppercase;
      animation: fade-in .9s .2s both;
    }

    .brand { display: flex; align-items: center; gap: 11px; color: #f5f8f4; font-weight: 650; letter-spacing: .16em; }
    .brand-mark { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 16px rgba(183, 242, 139, .75); }
    .availability { display: flex; align-items: center; gap: 9px; }
    .availability::before { width: 6px; height: 6px; border-radius: 50%; background: var(--green); content: ""; animation: pulse 2s infinite; }

    main { position: relative; width: min(100%, 840px); text-align: center; }

    .orbit {
      position: relative;
      display: grid;
      width: 144px;
      height: 144px;
      margin: 0 auto 37px;
      place-items: center;
      border: 1px solid rgba(183, 242, 139, .15);
      border-radius: 50%;
      animation: fade-in 1s .35s both, float 6s ease-in-out infinite;
    }

    .orbit::before, .orbit::after {
      position: absolute;
      inset: 11px;
      border: 1px solid var(--line);
      border-radius: 50%;
      content: "";
    }

    .orbit::after { inset: -10px; border-color: rgba(183, 242, 139, .08); }
    .orbit-ring { position: absolute; inset: -10px; border: 1px solid transparent; border-top-color: rgba(183, 242, 139, .65); border-radius: 50%; animation: spin 9s linear infinite; }
    .orbit-ring::after { position: absolute; top: 18px; right: 12px; width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 15px var(--green); content: ""; }
    .monogram { color: var(--green); font-family: Georgia, "Times New Roman", serif; font-size: 61px; font-weight: 400; line-height: 1; text-shadow: 0 0 35px rgba(183, 242, 139, .2); }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--green);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .32em;
      text-transform: uppercase;
      animation: rise-in .8s .4s both;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 10vw, 106px);
      font-weight: 520;
      letter-spacing: -.075em;
      line-height: .98;
      animation: rise-in .9s .52s both;
    }

    h1 span { color: var(--green); font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-style: italic; letter-spacing: -.065em; }

    .intro {
      max-width: 430px;
      margin: 25px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
      animation: rise-in .9s .68s both;
    }

    .launch-note {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 37px;
      padding: 12px 17px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .025);
      color: #dce5dd;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      animation: rise-in .9s .82s both;
    }

    .launch-note span { width: 5px; height: 5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }

    footer {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: center;
      padding: 25px;
      color: #718078;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      animation: fade-in 1s 1s both;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .35; box-shadow: 0 0 12px var(--green); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 520px) {
      .topbar { padding: 24px; font-size: 9px; }
      .availability { letter-spacing: .1em; }
      .orbit { width: 120px; height: 120px; margin-bottom: 32px; }
      .monogram { font-size: 52px; }
      .intro { max-width: 330px; font-size: 14px; }
      footer { font-size: 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <canvas id="stars" aria-hidden="true"></canvas>
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span> MUHAFFIZ</div>
      <div class="availability">A new experience is on its way</div>
    </header>

    <main>
      <div class="orbit" aria-hidden="true">
        <div class="orbit-ring"></div>
        <span class="monogram">M</span>
      </div>
      <p class="eyebrow">Something meaningful is coming</p>
      <h1>Muhaffiz<br><span>is coming soon.</span></h1>
      <p class="intro">We’re getting things ready. A fresh new experience is just around the corner.</p>
      <div class="launch-note"><span></span> Stay tuned&nbsp; · &nbsp;Launching soon</div>
    </main>

    <footer>Made with care&nbsp; · &nbsp;Muhaffiz</footer>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('stars');
      const context = canvas.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let width = 0;
      let height = 0;
      let particles = [];
      let frame = 0;

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        const count = Math.min(95, Math.floor(width * height / 14500));
        particles = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.3 + .35,
          speed: Math.random() * .22 + .06,
          phase: Math.random() * Math.PI * 2
        }));
        draw();
      }

      function draw() {
        context.clearRect(0, 0, width, height);
        particles.forEach((particle) => {
          const shimmer = .25 + (Math.sin(frame * .018 + particle.phase) + 1) * .28;
          context.beginPath();
          context.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
          context.fillStyle = `rgba(204, 239, 190, ${shimmer})`;
          context.fill();
          if (!reduceMotion) {
            particle.y -= particle.speed;
            if (particle.y < -3) {
              particle.y = height + 3;
              particle.x = Math.random() * width;
            }
          }
        });
        frame++;
        if (!reduceMotion) requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();
    })();
  </script>
</body>
</html>
